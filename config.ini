; Defaults. Put overrides and the password in config.local.ini (git-ignored), or set HUAWEI_PASSWORD.
[modem]
url = http://192.168.100.1/
username = admin
interval = 1.0
timeout = 5
; poll /api/monitoring/status every N signal polls
status_every = 1

[ping]
; "auto" = default gateway; 192.168.100.1 = the modem itself (measures the router->modem hop)
targets = auto, 192.168.100.1, 1.1.1.1
interval = 0.5
timeout_ms = 1000

[cs2]
; empty = auto-detect <Steam library>\steamapps\common\Counter-Strike Global Offensive\game\csgo\console.log
console_log =

[report]
window_s = 5
ul_smoothed_bad_pct = 5
ul_missed_bad_pct = 1
ul_jitter_p99_bad_ms = 15
ping_jitter_bad_ms = 10
ping_loss_bad_pct = 2
ping_target =

[netmode]
reference_request = samples/netmode_request.txt
lte = 03
auto = 00
nr = 08
